name: Bug report
description: A route, a categorization, or the explorer did something wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you call, what did you expect, what did you get.
      placeholder: |
        POST /add with {...}
        Expected: stored under category "technical"
        Got: stored as "uncategorized"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The request(s) and response(s). Strip any private memory content.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v4.0.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version + how you run Qdrant
      placeholder: "3.12, Qdrant in Docker"
