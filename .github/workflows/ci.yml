name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff, advisory)
        # Advisory while the server module is generalized off its in-house origins (see issues).
        # The blocking gates are the syntax check and the unit tests below.
        continue-on-error: true
        run: ruff check server tests

      - name: Syntax check all server modules
        run: python -m compileall -q server

      - name: Unit tests
        run: pytest -q
